overrides:
  vite: 8.3.6

catalog:
  '@hookform/resolvers': 7.0.3
  '@tailwindcss/vite': 4.3.4
  '@tanstack/react-query': 5.106.1
  '@tanstack/react-router': 1.170.46
  '@tanstack/react-table': 9.3.1
  axios: 1.21.0
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  lucide-react: 1.69.0
  radix-ui: 1.8.1
  react: 19.3.1
  react-dom: 19.3.1
  react-hook-form: 7.91.0
  recharts: 3.10.1
  tailwind-merge: 3.7.0
  tailwindcss: 4.3.4
  zod: 4.6.7
  zustand: 5.0.16

packages:
  - 'apps/*'
  - 'packages/*'

# Supply-chain guard: refuse to install releases younger than 7 days, so a
# freshly published (possibly compromised) package version cannot be pulled
# manually. Mirrors `minimumReleaseAge` in renovate.json.
minimumReleaseAge: 10080 # minutes (7 days)

# Native build scripts we trust to run on install (vite's esbuild, tailwind's oxide).
allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
minimumReleaseAgeExclude:
  # Renovate security update: vitest@4.1.11
  - vitest@4.1.11
  # Renovate security update: happy-dom@20.8.9 || 21.0.4
  - happy-dom@20.8.9 || 21.0.4
