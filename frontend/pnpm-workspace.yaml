catalog:
  '@hookform/resolvers': 5.1.1
  '@tailwindcss/vite': 4.1.11
  '@tanstack/react-query': 5.104.5
  '@tanstack/react-router': 1.170.45
  axios: 1.11.0
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  lucide-react: 0.536.0
  react: 19.1.1
  react-dom: 19.1.1
  react-hook-form: 7.62.0
  tailwind-merge: 3.3.1
  tailwindcss: 4.1.11
  zod: 4.0.14
  zustand: 5.0.7

packages:
  - 'apps/*'
  - 'packages/*'

# Supply-chain guard: refuse to install releases younger than 7 days, so a
# freshly published (possibly compromised) package version cannot be pulled
# manually. Mirrors `minimumReleaseAge` in renovate.json.
minimumReleaseAge: 10080 # minutes (7 days)

# Native build scripts we trust to run on install (vite's esbuild, tailwind's oxide).
allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
minimumReleaseAgeExclude:
  # Renovate security update: vite@6.4.4
  - vite@6.4.4
