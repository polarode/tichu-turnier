# Render Blueprint for the first production deploy (issue #45).
#
# Applied from the Render dashboard via "Blueprint" → point it at this repo:
# the dashboard reads this file and offers to create the service. Secrets are
# declared with `sync: false`: the blueprint requires them to exist, but the
# values are entered once by hand in the dashboard and never committed.
#
# Provider notes (no ADR — this choice is easily reversible):
#   - Database: Neon Postgres, free tier, region eu-central-1 (created by hand
#     in the Neon console — see scripts/provision-production.sh for the
#     walkthrough). Flyway uses Neon's *direct* endpoint; the runtime pool
#     uses the transaction-pooler endpoint with `prepareThreshold=0`.
#   - Fallback provider: Supabase (direct :5432 for Flyway, Supavisor pooler
#     for runtime; the project pauses after ~7 idle days).
services:
  - type: web
    name: tichu-turnier
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    # Free-tier instances spin down when idle; Render restarts the service on
    # the next request. Repeatedly failing health checks trigger a restart.
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Let the JVM see only ~75% of the container RAM so the heap leaves room
      # for metaspace, threads and the free tier's memory headroom.
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=75
      # Pooled runtime datasource (Neon transaction pooler):
      #   jdbc:postgresql://ep-…-pooler…/db?sslmode=require&prepareThreshold=0
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # Flyway's own direct (non-pooled) Neon endpoint, e.g.
      #   jdbc:postgresql://ep-….aws.neon.tech/db?sslmode=require
      - key: SPRING_FLYWAY_URL
        sync: false
      # Public origin of the app (the Render https://….onrender.com URL);
      # drives CORS and absolute invite links.
      - key: APP_FRONTEND_URL
        sync: false
      # First platform owner. OWNER_PASSWORD_HASH is a bcrypt hash of the
      # plaintext password, never the plaintext itself.
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD_HASH
        sync: false
