spring:
  application:
    name: template-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/tichu_turnier
    username: tichu
    password: tichu

  jpa:
    open-in-view: false
    hibernate:
      # The schema belongs to Flyway; Hibernate must never create or alter it.
      ddl-auto: validate

  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      # Health endpoint at GET /health, outside the API namespace (ADR 0002).
      base-path: /
  endpoint:
    health:
      # DataSource check included: unreachable DB yields 503; internals stay hidden.
      show-details: never
  health:
    defaults:
      enabled: true

app:
  # Public origin: the frontend dev server in dev, set via APP_FRONTEND_URL in the
  # single-origin image (base for invite links and the CORS allowed origin).
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}

  auth:
    # Admin session lifetime (ISO-8601 duration). 168h = 7 days.
    session-ttl: PT168H
    # Admin invite lifetime (ISO-8601 duration). 168h = 7 days.
    invite-ttl: PT168H
    session-cookie-name: admin_session
    # Team session lifetime (ISO-8601 duration). 12h — a team session is tied to match day.
    team-session-ttl: PT12H
    team-session-cookie-name: team_session
    # Failed team-link exchanges are rate-limited in memory, per source IP
    # (single-instance assumption — see ExchangeRateLimiter). Blocked callers get
    # the same generic rejection as a wrong guess.
    exchange-rate-limit:
      max-failures: 5
      window: PT15M
    # Cadence (ms) of the expired-session sweep (hourly).
    # Cookies are marked Secure. Modern browsers treat localhost as a secure
    # context, so this still works for local http dev; set false only for a
    # plain-http non-local host.
    session-cookie-secure: true
    # First platform owner, provisioned idempotently at startup when both members are
    # set. The credential is a bcrypt hash (never plaintext); see README for how to
    # generate one. Left blank, no owner is created, which is only useful in tests.
    owner:
      email: ${OWNER_EMAIL:}
      password-hash: ${OWNER_PASSWORD_HASH:}
