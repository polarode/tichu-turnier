name: CI - Deploy Image

# Builds the single-origin deploy image (ADR 0002, `deploy/Dockerfile`).
#   - PRs: build only — catch Docker-build breakage before main.
#   - main: build + push to GHCR as `sha-<git-sha>` (immutable) and `latest`.
#     Coolify on the VPS watches GHCR and deploys the new image automatically.
#
# No secrets are baked into the image (issue #43); everything sensitive is
# runtime configuration entered in the Coolify UI.

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'deploy/**'
      - '.github/workflows/deploy-image.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'deploy/**'
      - '.github/workflows/deploy-image.yml'

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  deploy-image:
    name: Build (and push on main) deploy image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.12.0

      - name: Login to GHCR
        if: ${{ github.event_name == 'push' }}
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (PR, no push)
        if: ${{ github.event_name == 'pull_request' }}
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push image (main)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
