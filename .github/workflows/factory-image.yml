name: factory-image

on:
  push:
    branches: [main, dark-factory]
    paths:
      - "factory/**"
      - ".github/workflows/factory-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: factory
          file: factory/Dockerfile
          push: true
          tags: |
            ghcr.io/polarode/tichu-turnier/factory:latest
            ghcr.io/polarode/tichu-turnier/factory:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
