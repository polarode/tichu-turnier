name: CI - Backend

# Temporarily disabled — manual trigger only (YAML parses `on` as boolean
# true when commented out, which makes the workflow run on every event).
# Restore the original triggers to re-enable:
# on:
#   push:
#     branches:
#       - main
#     paths:
#       - 'backend/**'
#       - '.github/workflows/backend-ci.yml'
#   pull_request:
#     branches:
#       - main
#     paths:
#       - 'backend/**'
#       - '.github/workflows/backend-ci.yml'
on:
  workflow_dispatch

jobs:
  backend-build:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Java 21
        uses: actions/setup-java@v6.1.0
        with:
          java-version: '21.0.13+9.0.LTS'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3.5.0

      - name: Build with Gradle
        run: |
          cd backend
          ./gradlew clean build

      - name: Run tests with Testcontainers
        run: |
          cd backend
          ./gradlew test
        env:
          CI: true
