overrides:
  vite: 8.3.5

catalog:
  '@hookform/resolvers': 6.0.0
  '@tailwindcss/vite': 4.3.3
  '@tanstack/react-query': 5.104.5
  '@tanstack/react-router': 1.170.45
  axios: 1.20.0
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  lucide-react: 1.61.0
  react: 19.3.1
  react-dom: 19.3.1
  react-hook-form: 7.90.0
  tailwind-merge: 3.7.0
  tailwindcss: 4.3.3
  zod: 4.6.7
  zustand: 5.0.16

packages:
  - 'apps/*'
  - 'packages/*'

# Supply-chain guard: refuse to install releases younger than 7 days, so a
# freshly published (possibly compromised) package version cannot be pulled
# manually. Mirrors `minimumReleaseAge` in renovate.json.
minimumReleaseAge: 10080 # minutes (7 days)

# Native build scripts we trust to run on install (vite's esbuild, tailwind's oxide).
allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
minimumReleaseAgeExclude:
  # Renovate security update: vitest@4.1.11
  - vitest@4.1.11
  # Renovate security update: happy-dom@20.8.9 || 21.0.4
  - happy-dom@20.8.9 || 21.0.4
