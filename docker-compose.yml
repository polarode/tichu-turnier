services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tichu_turnier
      POSTGRES_USER: tichu
      POSTGRES_PASSWORD: tichu
    ports:
      # Host port is configurable so it can coexist with a Postgres already on 5432.
      # The backend talks to `postgres:5432` over the compose network regardless.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tichu -d tichu_turnier"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tichu_turnier
      SPRING_DATASOURCE_USERNAME: tichu
      SPRING_DATASOURCE_PASSWORD: tichu
      APP_FRONTEND_URL: http://localhost:3000
      # First platform owner, provisioned idempotently at startup (Phase 4). Leave both
      # unset to skip owner provisioning. The password is a bcrypt hash, not plaintext.
      APP_AUTH_OWNER_EMAIL: ${OWNER_EMAIL:-}
      APP_AUTH_OWNER_PASSWORD_HASH: ${OWNER_PASSWORD_HASH:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm dev --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_web_node_modules:/app/apps/web/node_modules
      - frontend_ui_node_modules:/app/packages/ui/node_modules

volumes:
  pgdata:
  frontend_node_modules:
  frontend_web_node_modules:
  frontend_ui_node_modules:
