name: CI - Frontend

# Temporarily disabled — manual trigger only (YAML parses `on` as boolean
# true when commented out, which makes the workflow run on every event).
# Restore the original triggers to re-enable:
# on:
#   push:
#     branches:
#       - main
#     paths:
#       - 'frontend/**'
#       - '.github/workflows/frontend-ci.yml'
#   pull_request:
#     branches:
#       - main
#     paths:
#       - 'frontend/**'
#       - '.github/workflows/frontend-ci.yml'
on:
  workflow_dispatch

jobs:
  frontend-build:
    name: Frontend Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup PNPM
        uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.1'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          VITE_API_URL: http://localhost:8080
